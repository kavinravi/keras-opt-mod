name: Python package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            tensorflow: '2.15.1'
            legacy: '0'
          - python: '3.11'
            tensorflow: '2.20.0'
            legacy: '0'
          - python: '3.11'
            tensorflow: '2.20.0'
            legacy: '1'
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_USE_LEGACY_KERAS: ${{ matrix.legacy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' 'tensorflow==${{ matrix.tensorflow }}'
          if [ '${{ matrix.legacy }}' = '1' ]; then
            python -m pip install 'tf-keras==2.20.1'
          fi
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
